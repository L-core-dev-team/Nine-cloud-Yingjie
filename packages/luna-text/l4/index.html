<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>映界 L4 · 单次酒馆试点</title><link rel="stylesheet" href="/style.css"><script defer src="/entry.js"></script></head>
<body data-pilot="l4"><main><header>九霄 · 映界 L4</header><h1>单次酒馆叙事测试</h1>
<dl><div><dt>模型</dt><dd>gpt-6-luna · Standard</dd></div><div><dt>总额度</dt><dd>最多一次 · USD $0.10</dd></div></dl>

<label for="key">OpenAI 项目的 API Key</label><input id="key" type="password" disabled autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="512">

<div class="buttons"><button id="check" disabled>检查项目模型权限</button><button id="start" disabled>执行本次唯一请求</button><button id="clear" disabled>清除并关闭</button></div>
<small>检查时只向 OpenAI 查询模型资料。最后一个执行按钮才会发送剧情。Key 仅临时保存在内存中。</small>
</main></body></html>
