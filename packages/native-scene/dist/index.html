:root {
    color-scheme:light;
    --ink:#243632;
    --muted:#536660;
    --line:#d7d6c9;
    --cream:#f5f3e9;
    --paper:#fffdf5;
    --red:#9c4b37;
    --serif:"Songti SC","STSong","SimSun",serif;
    font:16px/1.6 "Microsoft YaHei",system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
}
* {
    box-sizing:border-box;
}
body {
    margin:0;
}
button,summary {
    font:inherit;
    cursor:pointer;
}
button:focus-visible,summary:focus-visible {
    outline:3px solid #be732b;
    outline-offset:3px;
}
[hidden] {
    display:none!important;
}
.mast {
    border-bottom:1px solid var(--line);
    background:#eeeee2;
}
.mast-inner,main {
    width:min(1120px,92%);
    margin:auto;
}
.mast-inner,.brand,.intro,.eyeline,.section-head,.controls,.plate-foot,footer {
    display:flex;
    align-items:center;
}
.mast-inner,.intro,.eyeline,.section-head,.plate-foot,footer {
    justify-content:space-between;
}
.mast-inner {
    height:67px;
}
.brand {
    gap:12px;
}
.brand strong {
    font:700 22px var(--serif);
    letter-spacing:.1em;
}
.brand i {
    color:var(--red);
}
.seal {
    width:31px;
    height:33px;
    background:var(--red);
    color:#fff8e5;
    display:grid;
    place-items:center;
    font:700 21px var(--serif);
    border-radius:4px;
}
.offline {
    font-size:13px;
    letter-spacing:.1em;
}
.offline b,.dot {
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#64816d;
}
.intro {
    margin:32px 0 22px;
    align-items:end;
}
.kicker,.caption,.eyeline,.section-head span,footer,.source-line {
    font-size:13px;
    color:var(--muted);
}
.kicker {
    margin:0 0 3px;
    letter-spacing:.12em;
}
.kicker span,.caption span {
    margin:0 7px;
    color:#a39982;
}
h1,h2,p {
    margin:0;
}
h1 {
    font:600 clamp(31px,4vw,47px)/1.4 var(--serif);
    letter-spacing:.07em;
}
.caption {
    padding-bottom:7px;
}
.spread {
    display:grid;
    grid-template-columns:1fr 1.13fr;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
}
.reading {
    padding:26px 34px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
}
.eyeline {
    letter-spacing:.09em;
}
.eyeline span:last-child {
    font:14px monospace;
}
.reading h2 {
    font:600 clamp(38px,5vw,64px)/1.25 var(--serif);
    margin:13px 0 7px;
}
.action {
    font-weight:650;
    font-size:17px;
}
.note {
    font-size:14px;
    color:var(--muted);
    margin:6px 0 14px;
    max-width:42ch;
}
.source-line {
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:auto;
}
.controls {
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}
button {
    border-radius:5px;
    border:1px solid var(--line);
    padding:8px 13px;
    background:transparent;
    color:var(--ink);
    font-size:14px;
    min-height:42px;
}
button.primary {
    background:#2b4941;
    color:#fffdf0;
    border-color:#2b4941;
}
.plain {
    border-color:transparent;
    text-decoration:underline;
    text-underline-offset:4px;
}
.controls button:disabled {
    opacity:.4;
    cursor:default;
}
.yj-panel.plate-panel {
    border:0;
    border-radius:0;
    box-shadow:none;
    align-self:stretch;
    padding:17px 22px;
    background:#203f3b;
    color:#f4e6c9;
    display:flex;
    flex-direction:column;
}
.yj-panel-head {
    font-size:14px;
    margin-bottom:10px;
}
.plate,.no-plate {
    position:relative;
    isolation:isolate;
    min-height:180px;
    flex:1;
    border:1px solid #789687;
    overflow:hidden;
    color:#c0d0ad;
    background:linear-gradient(105deg,#27413b,#436b5c);
}
.plate[data-id=loc_wangqitai] {
    background:linear-gradient(105deg,#3d4044,#5a637b);
    color:#e1c99d;
    border-color:#a7977d;
}
.engraving {
    position:absolute;
    width:100%;
    height:100%;
    z-index:-1;
}
.sky,.plate[data-id=loc_wangqitai] .water {
    display:none;
}
.plate[data-id=loc_wangqitai] .sky {
    display:block;
}
.plate-ink {
    position:absolute;
    inset:15px 24px;
    display:flex;
    align-items:start;
    justify-content:center;
    flex-direction:column;
    color:#fff3d5;
}
.plate-ink strong {
    font:500 69px/1.22 var(--serif);
}
.plate-ink small,.plate-ink span {
    letter-spacing:.22em;
    font-size:12px;
}
.plate-foot {
    margin-top:13px;
    font-size:13px;
}
.plate-foot span {
    color:#d2d8c6;
}
.no-plate {
    display:grid;
    place-items:center;
    text-align:center;
    background:#2c4740;
}
.timeline,.lower {
    margin-top:20px;
}
.timeline {
    padding:18px 22px 20px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:9px;
}
.section-head h2,summary {
    font:600 19px var(--serif);
}
.steps {
    display:flex;
    margin-top:15px;
    gap:5px;
}
.step {
    flex:1;
    padding:5px 1px;
    min-width:0;
    border:0;
    border-top:3px solid var(--line);
    border-radius:0;
    color:var(--muted);
    font:14px/1.4 monospace;
}
.step.visited {
    border-color:#738e7b;
}
.step[aria-current=step] {
    background:#e9ece0;
    border-color:var(--red);
    color:#792e1c;
    font-weight:bold;
}
.lower {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}
.lower details {
    min-width:0;
    padding:15px 19px;
    border-top:1px solid var(--line);
}
summary {
    line-height:1.65;
}
summary span {
    font:13px system-ui;
    color:var(--muted);
}
#entries,#fields {
    font-size:14px;
    color:var(--muted);
}
#entries p,#fields p {
    margin:9px 0;
}
.event {
    border-left:2px solid var(--red);
    padding-left:10px;
}
footer {
    margin:25px 0 16px;
    border-top:1px solid var(--line);
    padding-top:10px;
}
@media(max-width:680px) {
    .mast-inner {
        height:53px;
    }
    .intro {
        margin:20px 0 13px;
        align-items:start;
        flex-direction:column;
    }
    .caption {
        padding:0;
    }
    .spread,.lower {
        grid-template-columns:minmax(0,1fr);
    }
    .reading {
        padding:17px 19px;
    }
    .reading h2 {
        margin:6px 0;
    }
    .controls {
        margin-top:10px;
    }
    .yj-panel.plate-panel {
        padding:10px 15px;
    }
    .plate,.no-plate {
        min-height:142px;
    }
    .timeline {
        padding:12px;
    }
    .steps {
        flex-wrap:wrap;
    }
    .step {
        flex:1 0 13%;
    }
    .lower {
        gap:2px;
    }
    .timeline,.lower {
        margin-top:12px;
    }
    .note {
        margin-bottom:8px;
    }
    .plate-ink strong {
        font-size:48px;
    }
}

const frames=JSON.parse(document.querySelector("#trace").textContent).frames;
const el=id=>document.getElementById(id);
const copy=(id,text)=>{el(id).textContent=text;};
const notes={
    create:["建立序章存档","首次读取存档时，已能确认当前地点。"],
    move:["从芦花渡前往望气台","当前快照已经更新。这一刻尚未单独核验 R1 的历史行程。"],
    blocked:["返回芦花渡受阻","本次行动没有改变顶层地点，继续使用望气台的地点印记。"],
    sub:["移至同地点的子区域","世界地点仍为望气台。具体视角尚未确认。"],
    learn:["重新登录，查证早先的移动","在 R3 取得 R1 的行程证据。此前的回放节点仍保留当时所知。"],
    back:["从子区域返回","活动范围改变，顶层地点仍为望气台。"],
    observe:["完成一次调查","这一回合没有新增能用于画面的可见事实。"],
    bypass:["从望气台绕行返回芦花渡","当前地点由新的存档快照确认。绕行本身没有列入已核验的常规到达记录。"],
    late:["在芦花渡重读 R1","旧记录的目的地是望气台。当前地点仍由 R6 快照决定。"],
    revisit:["从芦花渡再次到达望气台","复访沿用同一地点身份。这次移动在已知行程中另记一笔。"],
    closed:["测试账号已关闭","读取权限已失效，当前地点和先前的行程证据均已隐藏。"]
};
let position=0, preview=true;
function paragraph(parent,text,cls) {
    const p=document.createElement("p");
    p.textContent=text;
    if(cls)p.className=cls;
    parent.append(p);
}
const steps=frames.map((_,i)=>{
    const button=document.createElement("button");
    button.className="step";button.textContent=String(i+1).padStart(2,"0");
    button.setAttribute("aria-label","跳到回放节点 "+(i+1));
    button.onclick=()=>go(i);
    el("steps").append(button);
    return button;
});
function go(i) {position=Math.min(frames.length-1,Math.max(0,i));render();}
function render(){
    const f=frames[position],loc=f.current;
    copy("place",loc?.name??"地点待确认");
    copy("revision",f.revision===null?"权限已失效":"存档 R"+f.revision);
    const [action,note]=notes[f.action];
    copy("action",action);copy("note",note);
    copy("source",loc?"受权存档快照 · R"+f.revision:"当前无可展示的受权快照");
    el("plate").hidden=!preview||!loc;
    el("plate").dataset.id=loc?.id??"";
    copy("glyph",loc?.id==="loc_luhuadu"?"渡":loc?.id==="loc_wangqitai"?"台":"");
    copy("plate-name",loc?.name??"");
    el("no-plate").hidden=preview&&!!loc;
    copy("no-plate",!loc?"位置证据已隐藏":"地点预览已关闭");
    el("toggle").setAttribute("aria-checked",String(preview));
    el("prev").disabled=position===0;el("next").disabled=position===frames.length-1;
    copy("counter","节点 "+(position+1)+" / "+frames.length);
    steps.forEach((button,i)=>{
        button.classList.toggle("visited",i<position);
        if(i===position)button.setAttribute("aria-current","step");else button.removeAttribute("aria-current");
    });
    el("entries").replaceChildren();
    copy("history-count",f.history.length+" 笔");
    if(!f.history.length)paragraph(el("entries"),loc?"此时尚无已核验的历史到达记录。":"行程已隐藏。");
    for(const h of f.history){
        paragraph(el("entries"),"历史 R"+h.revision+"　"+h.from.name+" → "+h.to.name+"　·　R"+h.learnedRevision+" 获证","event");
    }
    el("fields").replaceChildren();
    if(loc){
        paragraph(el("fields"),"当前位置来自本回放节点的 R"+f.revision+" 已提交快照。完整状态摘要见下。");
        paragraph(el("fields"),f.snapshotSHA256,"checksum");
        for(const h of f.history)paragraph(el("fields"),"历史 R"+h.revision+" · 核验截面 R"+h.observedThroughRevision+" · 首次获证 "+new Date(h.learnedAt).toISOString().replace("T"," ").replace("Z"," UTC"));
        paragraph(el("fields"),"尚未确认：人物名单、场景结构、时间、光照、观察位置与朝向。地点印记只用于区分地点。");
    }else paragraph(el("fields"),"此节点没有可披露的位置或视觉证据。");
}
el("next").onclick=()=>go(position+1);el("prev").onclick=()=>go(position-1);
el("toggle").onclick=()=>{preview=!preview;render();};
el("reset").onclick=()=>{preview=true;el("history").open=true;el("evidence").open=false;go(0);};
document.addEventListener("keydown",event=>{
    if(event.altKey||event.ctrlKey||event.metaKey)return;
    if(event.key==="ArrowRight"||event.key==="ArrowLeft"){
        event.preventDefault();go(position+(event.key==="ArrowRight"?1:-1));
    }
});
render();
</script></body></html>
